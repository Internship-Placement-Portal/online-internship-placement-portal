name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests + coverage (IPP-NF-006)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # mongodb-memory-server downloads a mongod binary on first use; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-7.0.14-${{ runner.os }}

      - run: npm ci

      # Runs every test file, then enforces >= 70 % line/function/branch coverage overall and on the core modules
      # (auth, applications, tests, scoring, uploads). Includes the RBAC matrix over every endpoint (IPP-SR-006).
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14

  client:
    name: Client build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

  scoring-service:
    name: Python scoring service tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: scoring-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scoring-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
